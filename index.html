<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNES Web Station</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --snes-gray-light: #d2d2d2;
            --snes-gray-dark: #b8b8b8;
            --snes-purple: #7356a6;
            --snes-purple-light: #9e89c9;
            --bg-color: #2e2e2e;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: var(--snes-purple-light);
            font-size: 1.5rem;
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 30px;
        }

        /* Moldura do Console */
        .console-case {
            background-color: var(--snes-gray-light);
            padding: 40px 20px 20px 20px;
            border-radius: 20px;
            border-bottom: 10px solid var(--snes-gray-dark);
            box-shadow: 0 20px 0 #1a1a1a;
            position: relative;
            max-width: 700px;
        }

        /* Entrada de Cartucho (Estética) */
        .cartridge-slot {
            width: 80%;
            height: 15px;
            background: #a0a0a0;
            margin: -30px auto 20px;
            border-radius: 5px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Tela do Jogo */
        #game-container {
            width: 640px;
            height: 480px;
            max-width: 100%;
            background-color: #000;
            border: 8px solid #333;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }

        /* Botões do Console */
        .buttons-row {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .btn-snes {
            width: 50px;
            height: 50px;
            background-color: var(--snes-purple);
            border: none;
            border-bottom: 4px solid #4a386a;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-snes:active {
            border-bottom: none;
            transform: translateY(4px);
        }

        .label {
            font-size: 8px;
            color: #555;
            text-align: center;
            margin-top: 5px;
        }

        .instructions {
            margin-top: 40px;
            font-size: 10px;
            color: #aaa;
            line-height: 1.6;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>SNES CLOUD PLAYER</h1>

    <div class="console-case">
        <div class="cartridge-slot"></div>
        
        <div id="game-container">
            <div id="game"></div>
        </div>

        <div class="buttons-row">
            <div>
                <button class="btn-snes" onclick="location.reload()"></button>
                <div class="label">RESET</div>
            </div>
            <div>
                <div style="width: 60px; height: 20px; background: #999; border-radius: 10px;"></div>
                <div class="label" style="margin-top: 35px;">POWER</div>
            </div>
        </div>
    </div>

    <div class="instructions">
        <p>COMO JOGAR:</p>
        <p>1. Clique na tela para carregar o emulador.<br>
           2. Use o ícone de pasta para selecionar sua ROM (.sfc ou .smc).<br>
           3. Para Multiplayer: Clique no ícone de rede (Netplay) dentro do menu.</p>
    </div>

    <iframe id="ejs-content-frame" width="100%" height="100%" border="0" frameborder="no" style="width: 100%; height: 100%; margin: 0px; padding: 0px; user-select: none;" scrolling="no" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="microphone" src="https://www.emulatorjs.com/embed/content.html"></iframe>

</body>
</html>
